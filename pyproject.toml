[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scigantic-empiar"
version = "0.4.1"
description = "Explore the EMPIAR cryo-EM archive from Python — stream any of ~3,000 datasets (8.9 PiB) over parallel HTTP range reads, nothing downloaded."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Scigantic" }]
keywords = ["cryo-em", "cryo-et", "empiar", "mrc", "structural-biology", "microscopy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24,<3",
    "requests>=2.28,<3",
    "scigantic-headers>=0.1.3,<1",
]

[project.optional-dependencies]
# Needed for preview() (rendering) and EmpiarCatalog gallery/search.
viz = ["matplotlib", "pandas", "pillow", "ipython"]
dev = ["pytest", "matplotlib", "pandas"]

[project.urls]
Homepage = "https://scigantic.com"
Repository = "https://github.com/Scigantic/scigantic-empiar"
Issues = "https://github.com/Scigantic/scigantic-empiar/issues"
"EMPIAR" = "https://www.ebi.ac.uk/empiar/"

[tool.setuptools]
packages = ["scigantic_empiar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
